<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">v1.3 多插件原子演进事务</title>
  <desc id="desc">用户目标经过 Actor 确认、可信源码快照、Builder 隔离修改、逐插件测试、组合验证和 Shadow Profile 冷启动，最后由 Atomic Gate 整体生效或整体保持旧版本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0a1c35"/>
      <stop offset="1" stop-color="#10152d"/>
    </linearGradient>
    <linearGradient id="loom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12385b"/>
      <stop offset="1" stop-color="#191f49"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#fb923c"/>
    </marker>
    <style>
      .cn{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
      .title{font-size:40px;font-weight:750;fill:#f8fafc}
      .subtitle{font-size:18px;fill:#9fb5ce}
      .node-title{font-size:20px;font-weight:700;fill:#edf8ff}
      .node-copy{font-size:15px;fill:#a8bed3}
      .small{font-size:13px;fill:#8099b4;letter-spacing:.7px}
      .chip{font-size:14px;font-weight:700}
      .box{fill:#0c2139;stroke:#2b5372;stroke-width:1.5}
      .flow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow-cyan)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1185" cy="320" r="270" fill="#7c3aed" opacity="0.055"/>
  <circle cx="430" cy="520" r="300" fill="#06b6d4" opacity="0.04"/>

  <g class="cn">
    <text x="76" y="86" class="title">多插件协同，不是三次单插件更新</text>
    <text x="76" y="120" class="subtitle">同一目标、同一冻结候选、同一裁决边界；任一环节失败，整个组合保持旧版本。</text>
    <g transform="translate(1360 58)">
      <rect width="166" height="42" rx="21" fill="#7c3aed" opacity="0.22" stroke="#a78bfa"/>
      <text x="83" y="27" text-anchor="middle" class="chip" fill="#ddd6fe">v1.3 Preview</text>
    </g>

    <!-- ingress -->
    <g transform="translate(72 198)">
      <rect class="box" width="226" height="126" rx="22"/>
      <circle cx="40" cy="39" r="16" fill="#22d3ee" opacity="0.2" stroke="#67e8f9"/>
      <path d="M32 39h16M40 31v16" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
      <text x="70" y="45" class="node-title">用户目标</text>
      <text x="24" y="80" class="node-copy">一个跨插件的真实结果</text>
      <text x="24" y="104" class="small">自然语言 · 当前 Profile</text>
    </g>
    <path class="flow" d="M298 261H354"/>
    <g transform="translate(360 198)">
      <rect class="box" width="226" height="126" rx="22"/>
      <path d="M28 34h24M28 43h17M28 52h21" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="45" class="node-title">Actor 确认</text>
      <text x="24" y="80" class="node-copy">锁定目标、依赖与验收</text>
      <text x="24" y="104" class="small">Builder 不猜插件身份</text>
    </g>
    <path class="flow" d="M586 261H642"/>
    <g transform="translate(648 198)">
      <rect class="box" width="226" height="126" rx="22"/>
      <path d="M28 34h28v24H28zM34 28h28v24" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="76" y="45" class="node-title">可信源码快照</text>
      <text x="24" y="80" class="node-copy">commit · integrity · hash</text>
      <text x="24" y="104" class="small">无法对应则 fail closed</text>
    </g>

    <!-- transaction workspace -->
    <g transform="translate(934 164)">
      <rect width="580" height="370" rx="30" fill="url(#loom)" stroke="#5b72a2" stroke-width="2"/>
      <rect x="18" y="18" width="544" height="334" rx="22" fill="none" stroke="#93c5fd" stroke-opacity="0.16" stroke-dasharray="7 8"/>
      <text x="34" y="58" class="node-title">Builder 隔离工作区</text>
      <text x="34" y="84" class="small">一个 workspace · 最多三个可信源码目标 · 不接触 live Profile</text>

      <g transform="translate(34 112)">
        <rect width="154" height="132" rx="18" fill="#092f40" stroke="#22d3ee" stroke-width="2"/>
        <circle cx="32" cy="32" r="12" fill="#22d3ee" opacity="0.3"/>
        <text x="55" y="38" class="node-title" font-size="18">插件 A</text>
        <text x="18" y="76" class="node-copy">源码 + 测试</text>
        <rect x="18" y="96" width="118" height="14" rx="7" fill="#22d3ee" opacity="0.18"/>
        <rect x="18" y="96" width="92" height="14" rx="7" fill="#22d3ee" opacity="0.72"/>
      </g>
      <g transform="translate(213 112)">
        <rect width="154" height="132" rx="18" fill="#211b46" stroke="#a78bfa" stroke-width="2"/>
        <circle cx="32" cy="32" r="12" fill="#a78bfa" opacity="0.3"/>
        <text x="55" y="38" class="node-title" font-size="18">插件 B</text>
        <text x="18" y="76" class="node-copy">源码 + 测试</text>
        <rect x="18" y="96" width="118" height="14" rx="7" fill="#a78bfa" opacity="0.18"/>
        <rect x="18" y="96" width="105" height="14" rx="7" fill="#a78bfa" opacity="0.72"/>
      </g>
      <g transform="translate(392 112)">
        <rect width="154" height="132" rx="18" fill="#153329" stroke="#34d399" stroke-width="2"/>
        <circle cx="32" cy="32" r="12" fill="#34d399" opacity="0.3"/>
        <text x="55" y="38" class="node-title" font-size="18">插件 C</text>
        <text x="18" y="76" class="node-copy">源码 + 测试</text>
        <rect x="18" y="96" width="118" height="14" rx="7" fill="#34d399" opacity="0.18"/>
        <rect x="18" y="96" width="86" height="14" rx="7" fill="#34d399" opacity="0.72"/>
      </g>
      <path d="M111 255v38h179M290 255v38M469 255v38H290" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
      <circle cx="290" cy="293" r="8" fill="#67e8f9" filter="url(#glow)"/>
      <rect x="190" y="305" width="200" height="34" rx="17" fill="#071c31" stroke="#67e8f9"/>
      <text x="290" y="327" text-anchor="middle" class="chip" fill="#a5f3fc">全部 build / test 通过</text>
    </g>
    <path class="flow" d="M874 261H928"/>

    <!-- lower verification rail -->
    <path d="M1224 534v54H710" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(494 588)">
      <rect class="box" width="260" height="130" rx="22"/>
      <path d="M31 32l10 10 20-22M31 57l10 10 20-22" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="48" class="node-title">组合 Verifier</text>
      <text x="24" y="86" class="node-copy">来源 · 契约 · 依赖图</text>
      <text x="24" y="108" class="small">报告与 proposal hash 绑定</text>
    </g>
    <path class="flow" d="M754 653H796"/>
    <g transform="translate(802 588)">
      <rect class="box" width="276" height="130" rx="22"/>
      <path d="M26 61h46v30H26zM33 45h32l7 16H26z" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="91" y="48" class="node-title">Shadow Profile</text>
      <text x="24" y="86" class="node-copy">一次安装全部冻结 tar</text>
      <text x="24" y="108" class="small">冷启动 · Loader · integration probe</text>
    </g>
    <path class="flow" d="M1078 653H1134"/>
    <g transform="translate(1140 568)">
      <rect width="390" height="170" rx="26" fill="#241d25" stroke="#fb923c" stroke-width="2.5"/>
      <path d="M39 36v64M21 55h36M21 81h36" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
      <text x="84" y="54" class="node-title">Atomic Gate</text>
      <text x="84" y="81" class="small">唯一 live apply / rollback 权限</text>
      <path d="M195 104v24H105M195 128h92" fill="none" stroke="#fb923c" stroke-width="2.5"/>
      <g transform="translate(24 132)">
        <circle cx="10" cy="-4" r="6" fill="#34d399"/>
        <text x="24" y="1" class="chip" fill="#86efac">整体生效</text>
      </g>
      <g transform="translate(210 132)">
        <circle cx="10" cy="-4" r="6" fill="#fbbf24"/>
        <text x="24" y="1" class="chip" fill="#fde68a">整体保持旧版本</text>
      </g>
    </g>

    <!-- invariant footer -->
    <g transform="translate(72 784)">
      <rect width="1458" height="72" rx="20" fill="#08192d" stroke="#29445e"/>
      <text x="28" y="31" class="chip" fill="#cbd5e1">事务不变量</text>
      <text x="28" y="55" class="node-copy">任一插件失败、Profile 漂移、报告缺失或冷启动不通过，都不会暴露半升级状态。</text>
      <g transform="translate(1172 17)">
        <rect width="256" height="38" rx="19" fill="#0b2e37" stroke="#22d3ee"/>
        <text x="128" y="25" text-anchor="middle" class="chip" fill="#a5f3fc">all verified → one activation</text>
      </g>
    </g>
  </g>
</svg>
