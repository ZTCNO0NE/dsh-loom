<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">v1.2 用户主动演进任务卡</title><desc id="desc">用户提出自然语言需求，Actor 提出候选并等待确认，mini-SWE 在隔离空间实现，独立 Verifier 与 Gate 裁决，Actor 返回真实结果。</desc>
  <style>text{font-family:Inter,Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.s{font-size:16px;fill:#526074}.b{font-size:18px;font-weight:700}.n{font-size:14px;fill:#526074}.box{stroke-width:2}.arrow{stroke:#7c8ca5;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#7c8ca5"/></marker></defs>
  <rect width="1200" height="500" fill="#f8fafc"/><text x="60" y="60" class="h">v1.2 产品轨：Actor 对话任务卡</text><text x="60" y="88" class="s">用户只说需求；内部 plan、路径、快照和模型推理不出现在对话里。</text>
  <rect x="60" y="150" width="185" height="145" rx="16" fill="#e0f2fe" stroke="#0284c7" class="box"/><text x="83" y="190" class="b">用户</text><text x="83" y="218" class="n">自然语言委托</text><text x="83" y="242" class="n">可确认 / 查看 / 取消</text>
  <path d="M245 222H320" class="arrow"/>
  <rect x="325" y="125" width="220" height="195" rx="16" fill="#eef2ff" stroke="#4f46e5" class="box"/><text x="350" y="168" class="b">Actor</text><text x="350" y="197" class="n">基于会话证据提出候选</text><text x="350" y="222" class="n">冻结任务卡，等待确认</text><text x="350" y="247" class="n">后台翻译关键进度</text><text x="350" y="272" class="n">终态解释限制与结果</text>
  <path d="M545 222H620" class="arrow"/>
  <rect x="625" y="125" width="225" height="195" rx="16" fill="#fef3c7" stroke="#d97706" class="box"/><text x="650" y="168" class="b">mini-SWE</text><text x="650" y="197" class="n">独立 immutable workspace</text><text x="650" y="222" class="n">实现 Config / Skill 候选</text><text x="650" y="247" class="n">提交，不拥有放行权</text><text x="650" y="272" class="n">运行中不强杀</text>
  <path d="M850 222H925" class="arrow"/>
  <rect x="930" y="125" width="210" height="195" rx="16" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="955" y="168" class="b">Verifier / Gate</text><text x="955" y="197" class="n">独立验证与冷应用</text><text x="955" y="222" class="n">通过：已生效</text><text x="955" y="247" class="n">拒绝：未生效</text><text x="955" y="272" class="n">失败：保留审计、重做新任务</text>
  <path d="M1035 320 C1035 405,435 405,435 325" class="arrow"/><text x="600" y="430" class="s">关键节点通知：等待确认 · 开始隔离实现 · 独立裁决完成；普通工具步骤不打扰用户。</text>
</svg>
